name: CI Tests

on:
  push:
    branches:
      - main
      - master
      - '**'  # all branches
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, dom, pdo, sqlite, xdebug
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare CI environment
        run: cp .env.ci .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit with coverage
        run: |
          if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
            vendor/bin/phpunit --coverage-clover=storage/coverage/clover.xml --coverage-html=storage/coverage/html
          else
            echo "No PHPUnit configuration found. Skipping tests."
          fi

      - name: Publish coverage to current branch
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ github.ref_name }}
          publish_dir: storage/coverage/html
          allow_empty_commit: true
